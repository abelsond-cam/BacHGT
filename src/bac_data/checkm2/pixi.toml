[workspace]
name = "bac-checkm2"
version = "0.1.0"
description = "CheckM2 runner for the LRA cohort — LR-GCAs + is_refseq assemblies"
authors = ["David Abelson <dca36@cam.ac.uk>"]
channels = ["conda-forge", "bioconda"]
# Linux-only — CheckM2 runs on HPC, not on the dev laptop.
platforms = ["linux-64"]

[dependencies]
python  = ">=3.10,<3.12"
# CheckM2 1.0.2 / 1.1.0 pin diamond 2.0.4.* and pandas <=1.4.0 exactly — don't
# add our own diamond / pandas pins here, the solver wires them in transitively.
# This env runs only the `checkm2 predict` binary; the prep script
# `bac_data.checkm2.prep_checkm2_inputs` runs from the shared uv env (modern
# pandas), not from this pixi env.
checkm2 = ">=1.0.2"
