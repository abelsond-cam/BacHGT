# Attribute spec — M. abscessus application
#
# SINGLE SOURCE OF TRUTH for the M. abscessus curation rubric. David edits this directly.
# Same engine + grade scale as Klebsiella; the species-specific slots are the CF phenotype and the
# antibiotic-susceptibility (AST) panel. Grading definitions are David's — do not invent grading criteria.
#
# 2026-08-28 (m_abs redo, M0): the six Klebsiella rubric-PROSE refinements gained after this file's July
# infrastructure port were ported here — whole_project_rule (PORT-1), study_level.sizing_first (PORT-2),
# study_level.grading_basis (PORT-3), the study_type "routine lab culturing is NOT experimental_evolution"
# guard (PORT-4), the country funding/affiliation guard (PORT-5), and the isolation_source be-SPECIFIC /
# lab-is-not-a-source prose (PORT-6). AST DETECTION grades (reports_AST / per_sample_AST) are FINALISED;
# per-drug paper EXTRACTION stays DEFERRED (David — "scope, don't extract yet"): the panel is parked under
# `ast_panel.drugs_deferred` so the engine does not mine per-isolate AST this round, while the 7-drug
# `ast_panel.ast_backbone_drugs` stays active for the M2 availability report. The m_abs-specific blocks
# (cf_status rule, never_overwrite, host-not-species, sample_identifier_columns, strict-date escalation) are
# UNCHANGED. Editing the graded prose above busts the content-addressed grade cache -> a full, intended re-grade.
# See ../../PROGRESS_REPORT.md (engine + attribute-spec model) and the approved M. abscessus redo plan.
grade_scale: [gradeable, partial, not_gradeable]

application: m_abs
species: Mycobacterium abscessus   # ENA records use the reclassified genus 'Mycobacteroides abscessus'

# PIPELINE GATES — the application's tunable curation thresholds (mirrors the Klebsiella `gates` block; the
# engine reads these via AttributeSpec and falls back to a generic default only when a key is omitted). Ported
# 2026-07-17 for the M.abs re-run: without this block m_abs silently ran on the engine defaults AND, crucially,
# on a SINGLE 120k-char grade pass instead of the cost-saving tier ladder. The residual/big-decision floors are
# the Klebsiella-scale defaults (validated there); revisit if the ~7k-sequence M.abs cohort makes them too
# loose/tight. David, 2026-07-17.
gates:
  completeness_threshold: 0.75         # ENA non-null fraction at/above which a field counts as already complete -> not filled
  escalation_residual_floor: 50        # min blank samples remaining after per-sample before a field is worth escalating
  escalation_big_decision_frac: 0.01   # a study at/above this fraction of the WHOLE cohort is an escalation "big decision"
  # Paper-text budgets the grader climbs, smallest first (~4 chars/token): reads only the FIRST tier and climbs
  # ONLY when it self-reports the truncated remainder might hold an answer (full_text_would_help). Most studies
  # resolve at 10k (the abstract), collapsing average per-call tokens; 50k reaches abstract+methods; 250k (~62k
  # tokens) captures ~p90 of full texts for the rare deep answer. Top tier is also the escalation-triage budget.
  grade_context_tiers: [10000, 50000, 250000]

# Species we are studying. Project sizing, paper coverage and completeness are computed over records
# MATCHING this (projects can mix taxa), not over the whole project.
taxon_of_interest:
  rank: species
  name: Mycobacterium abscessus
  # Substring match against the ENA `scientific name`. Match on the SPECIES epithet so it catches both
  # the old 'Mycobacterium abscessus' and the reclassified 'Mycobacteroides abscessus' (the xlsx uses
  # the latter — matching the genus alone would size every project to zero).
  scientific_name_match: [abscessus]

# FIRST-RUN SCOPE (David, 2026-06-25): the first pass targets the ~20 LARGEST studies (biggest-first) to
# get data flowing before scaling to all 133. This is a runner/scope choice (Phase M4), not a rubric rule.

attributes:

  # 0) PAPER SELECTION — sizing the project (from EBI) and how well the chosen paper covers it.
  #    Carried verbatim from the Klebsiella rubric (the >75% whole-project applicability rule). [keep]
  paper_selection:
    paper_coverage_for_taxon:
      description: >-
        Fraction of the project's taxon-of-interest records (NOT total project records) that the chosen
        paper describes. Distinguishes a whole-project paper from one describing only a subsample, and
        guides picking the paper covering the largest part.
      inputs: [project_records_in_taxon, paper_records_in_taxon]
      ground_truth: none
      definition: |-
        Computed fraction = paper_records_in_taxon / project_records_in_taxon. Gates whether a study-level
        whole-project value (e.g. all CF, all from one country) may be applied to every sample:
        coverage > 75% -> apply project-wide; <= 75% -> do not apply project-wide UNLESS the EBI study
        title/description itself states it applies to the whole study. Also guides picking the paper that
        covers the largest part of the project.

  # 1) STUDY FILTERS — decide whether the whole study enters the cohort. Carried from Klebsiella. [keep]
  study_filters:
    study_type:
      values: [observational, experimental_evolution, other]
      exclude_if: [experimental_evolution]
      ground_truth: none
      definition: |-
        How the isolates arose. Observational by default.
        - observational: isolates sampled as they occur (clinical, carriage, environmental).
        - experimental_evolution: a study that DELIBERATELY alters the strains and then sequences them —
          by genetic engineering (gene knockout, CRISPR) OR by inducing evolution (e.g. serial passage or
          culturing in antibiotic broth to drive resistance mutations). Specific and rare; the paper states
          it explicitly. Routine lab culturing of clinical/environmental isolates is NOT experimental
          evolution — almost every study grows its isolates in vitro, and an isolation_source or host of
          "in vitro" / "laboratory" on its own does NOT make a study experimental_evolution. EXCLUDED from
          the cohort.
        - other: anything not fitting the above.

  # 2) STUDY-LEVEL JUDGEMENTS — the two AST judgements for M. abscessus (reports_AST + per_sample_AST);
  #    study_setting / amr_study and their dependents are dropped (nearly all M.abs isolates are
  #    drug-resistant and hospital-derived). The sizing_first + grading_basis preambles below are shared by
  #    both judgements (ported from Klebsiella, 2026-08-28 — PORT-2, PORT-3).
  study_level:
    # SIZING SANITY-CHECK — shared preamble to every study-level judgement below. Adapted from Klebsiella:
    # the amr_study-specific example is dropped (m_abs has no amr_study); the A/B/C reconcile logic is generic
    # and applies to reports_AST, per_sample_AST, and every whole-project fill.
    sizing_first: |-
      SIZING SANITY-CHECK — DO THIS FIRST, BEFORE GRADING. Establish the true size of THIS accession from
      ENA, then reconcile it against the numbers stated in the article. Trust the ENA-derived counts (Stage-1
      ena_taxon_samples / total samples); do NOT trust a spreadsheet's stated study size.
      Let E = the ENA-deposited count for this accession (E_taxon = the taxon-of-interest subset). Compare E
      to the article:
        A) article's SCREENED / COLLECTED cohort is substantially LARGER than E
             -> substantial SAMPLE SELECTION happened before sequencing: only a subset was actually
                sequenced and deposited. Judge the study-level attributes on that DEPOSITED subset.
        B) article's SEQUENCED-genome count is substantially LARGER than E
             -> the study spans MULTIPLE accessions and this is only one of them (often not stated
                explicitly); a whole-project value may not cover the whole article.
        C) article's sequenced count is substantially SMALLER than E
             -> this is a SHARED / umbrella accession holding more than this one study deposited; a single
                whole-project value may not be gradeable.
      Counts always refer to the ENA-deposited set, never the parent/screened cohort.
    grading_basis: |-
      gradeable     — a single value is supported for the WHOLE project, by the EBI study title/description,
                      or by a paper describing most (>75%) of the project's taxon-of-interest records.
                      Applied to every sample.
      partial       — a value applies to only part of the project and CANNOT be attributed to specific
                      samples. Attributing it would require a per-sample table in the paper (sample
                      accessions we can map back to our data); left unattributed and possibly revisited later.
      not_gradeable — the value cannot be determined from the EBI metadata or an accessible paper.
    reports_AST:
      values: [yes, no]
      ground_truth: none                       # no curated M.abs ground truth; generate + spot-check
      definition: |-
        Does the study report PHENOTYPIC antibiotic-susceptibility-test results (an MIC and/or a
        categorical S/I/R call) for one or more M. abscessus isolates — at AGGREGATE or PER-SAMPLE level.
        This is a LOOK-CLOSER FLAG (it prioritises per-sample AST mining): aggregate-only reporting still
        counts `yes`, because such papers often publish a per-isolate AST table in a supplement worth
        chasing. GENOTYPIC resistance prediction (erm(41) sequevar, rrl/rrs mutations, etc.) does NOT
        count — phenotypic only.
        - yes: phenotypic AST reported for >=1 isolate (aggregate or per-sample).
        - no:  no phenotypic AST reported.
        This is a BROAD flag — phenotypic AST for ANY antibiotic counts `yes`, not only the backbone panel.
        The 7-drug BACKBONE we track for all downstream AST work (see `ast_panel.ast_backbone_drugs`; it
        matches the collaborator table's panel) is the reference set for the M2 paper-AST availability report,
        which records WHICH backbone drugs each `yes` study reports — the grade itself stays a whole-study
        yes/no.
        Grade: `gradeable` when an accessible paper makes this clear; `not_gradeable` when no paper is
        accessible. (`partial` is unlikely here — it is a single whole-study yes/no.)

    # FINALISED 2026-08-28 (David) — the manual-follow-up triage flag, AND the SCOPING signal for the deferred
    # per-drug AST extraction. First passes showed the AST panel rarely fires: even reports_AST=yes studies
    # usually have no per-isolate PHENOTYPIC AST table the engine can retrieve (paywalled, PDF-only, or
    # genotypic-only). This flag records WHICH studies are worth manual effort — and, aggregated across the
    # cohort in the M2 availability report, is how we decide whether per-drug PAPER extraction is worth
    # pursuing at all (the collaborator-table AST still lands regardless, via the M4 combine).
    per_sample_AST:
      values: [retrievable, possible, none]
      ground_truth: none
      definition: |-
        Whether a PER-ISOLATE (per-sample) PHENOTYPIC AST table for this study can be obtained — the flag
        that tells the curator which papers are worth manual follow-up for AST mining. Judge from the paper
        + its supplements (GENOTYPIC resistance — erm(41), rrl/rrs mutations — does NOT count):
        - retrievable: a per-isolate phenotypic AST table (MIC and/or S/I/R per named isolate) exists in an
          OPENLY ACCESSIBLE, machine-readable form — an xlsx/csv/HTML supplementary table, or an in-text
          table keyed to isolate/sample identifiers we can map to accessions.
        - possible: per-isolate phenotypic AST appears to exist but is NOT readily machine-retrievable —
          it is paywalled, PDF-/image-only, or keyed to identifiers not linkable without manual work.
        - none: no per-isolate phenotypic AST at all (aggregate-only AST, genotypic-only, or none).
        When reports_AST=no this is `none` (never blank). Grade `gradeable` when an accessible paper makes
        it clear; `not_gradeable` when no paper is accessible. Backbone drugs: see `ast_panel.ast_backbone_drugs`.

  # 3) PER-SAMPLE VARIABLES — the bulk of the task. The four core fields PLUS the M. abscessus phenotype
  #    field (cf_status) and the AST panel. All per-sample, each with a whole-study fallback (fill all
  #    samples when the cohort is uniform — same model as Klebsiella country/source).
  per_sample_completeness:
    fields: [country, collection_date, isolation_source, host, cf_status]
    # WIDEST-AXIS field a per-sample table value may NEVER overwrite — filled only where ENA is BLANK (and
    # only under the ≥95% whole-project rule). cf_status is the headline phenotype: any change to a recorded
    # CF/non-CF value is unacceptable (David, 2026-07-18). The engine's overwrite guard drops every overwrite
    # of it — single- or two-hop — keeping the recorded value; blank-fills still flow.
    never_overwrite: [cf_status]
    ground_truth: none
    deterministic_normaliser: {}              # no M.abs parsers (Klebsiella-only; engine no-ops when empty)

    # ⚠️ CRITICAL FIRST STEP FOR ANY NEW SPECIES — the per-sample identifier columns the engine anchors
    # supplementary tables on. The extractor is anchor-AGNOSTIC: it builds an id→sample map from these base
    # columns and finds whichever supp-table column matches BY VALUE (never by column name). If this set is
    # too thin, per-isolate extraction (AST, cf_status, dates from paper tables) silently yields NOTHING —
    # the M.abs first pass produced 0 fills until strain/lane were added. So when onboarding a new species,
    # REVIEW EVERY column of the input table and list here ALL that are per-sample identifiers a paper might
    # key a table on: deposited accessions, ENA aliases, strain/isolate names, sequencing lane IDs, etc.
    # EXCLUDE per-patient / per-study identifiers (e.g. a Patient column) — they collide across samples.
    # (Klebsiella declares none → the engine's built-in default id set; see PROGRESS_REPORT.md.)
    sample_identifier_columns:
      - run_accession
      - sample_accession
      - secondary_sample_accession
      - accession
      - experiment_accession
      - sample_alias
      - run_alias
      - experiment_alias
      - sample_title
      - strain
      - isolate
      - library_name
      - lane
      - lane_sanitised

    # ── ANTIBIOTIC SUSCEPTIBILITY PANEL ───────────────────────────────────────────────────────────────
    # ⛔ PER-DRUG PAPER EXTRACTION IS DEFERRED THIS ROUND (David, 2026-08-28 — "scope, don't extract yet").
    # The engine turns per-isolate AST mining ON only when this block exposes a `drugs:` key
    # (run_full_metadata_agent.py reads ast_panel.drugs -> ast_drugs; empty/absent -> None -> extractor
    # unchanged). To keep extraction OFF while preserving David's curated list, the full panel is parked
    # verbatim under `drugs_deferred:` below; the engine sees NO `drugs:` key and does not extract. Detection
    # (reports_AST / per_sample_AST) + the M2 paper-AST availability report still run — we scope how much
    # per-drug data exists, and from how many papers, BEFORE deciding whether extraction is worth it. The
    # in-hand collaborator-table AST still lands as data via the M4 combine.
    # ➡️  TO RE-ENABLE per-drug paper extraction later: rename `drugs_deferred:` back to `drugs:`.
    #
    # When re-enabled the panel expands to TWO per-sample fields per drug (generated from `drugs`):
    #   ast_<drug>_mic          the MIC string EXACTLY as reported  ('8', '>64', '<=0.25', or a bare S/R)
    #   ast_<drug>_resistance   the categorical call EXACTLY as reported  (S / I / R, 'resistant', ...)
    # RECORD VERBATIM — DO NOT INTERPRET. No breakpoint application, no normalisation, no derivation of a
    # category from an MIC. Sparse by design (absent drug = not tested -> abstain, never guess). Inducible-
    # macrolide (day-14) reads are DEFERRED. [TODO(david): the deferred drug list is wide on purpose ("more
    # data the better"); add/remove canonical names + synonyms freely before re-enabling.]
    ast_panel:
      per_drug_fields: [mic, resistance]
      record_rule: |-
        Verbatim only. ast_<drug>_mic = the reported MIC string as-is. ast_<drug>_resistance = the reported
        categorical susceptibility call as-is (S/I/R or an equivalent wording). Never infer one from the
        other; never apply CLSI/EUCAST breakpoints. Leave a field blank if that value is not reported.
      # THE 7-DRUG BACKBONE for ALL AST work (David, 2026-08-28): the panel the collaborator table reports, and
      # the reference set the reports_AST / per_sample_AST detection grades and the M2 availability report are
      # anchored on. A subset of the deferred panel; stays ACTIVE (read by the availability report) even while
      # per-drug PAPER extraction is off. All seven are also present in `drugs_deferred` below.
      ast_backbone_drugs: [cefoxitin, amikacin, tigecycline, clarithromycin, linezolid, imipenem, tobramycin]
      # PARKED — not read by the engine (renamed from `drugs:` to keep per-drug extraction OFF this round).
      drugs_deferred:
        # macrolides
        - clarithromycin
        - azithromycin
        # aminoglycosides
        - amikacin
        - tobramycin
        - kanamycin
        - gentamicin
        - streptomycin
        # carbapenems (beta-lactam)
        - imipenem
        - meropenem
        - ertapenem
        - doripenem
        - faropenem
        - tebipenem
        # cephalosporins (beta-lactam)
        - cefoxitin
        - ceftriaxone
        - cefotaxime
        - ceftaroline
        - ceftazidime
        # beta-lactam / inhibitor combinations
        - amoxicillin_clavulanate
        - piperacillin_tazobactam
        - ceftazidime_avibactam
        - imipenem_relebactam
        # tetracyclines / glycylcyclines
        - doxycycline
        - minocycline
        - tigecycline
        - omadacycline
        - eravacycline
        # fluoroquinolones
        - moxifloxacin
        - ciprofloxacin
        - levofloxacin
        - gatifloxacin
        - ofloxacin
        # oxazolidinones
        - linezolid
        - tedizolid
        # other antimycobacterials
        - trimethoprim_sulfamethoxazole
        - clofazimine
        - bedaquiline
        - rifabutin
        - rifampicin
        - ethambutol
        - isoniazid
        - cycloserine
        - capreomycin
      other:
        field: ast_other
        meaning: free-text 'drug=value' for any phenotypic AST result whose drug is not in the panel above.

    completeness:
      definition: |-
        Non-null fraction per field, measured before and after backfill. Measured, not curated — no grade.

    # THE BACKFILL — fill each field where the input left it blank; two methods, tried in order.
    backfill:
      # WHOLE-PROJECT FILL RULE (PORT-1, 2026-08-28) — the application policy the grader applies to decide when
      # ONE value covers the whole project (rendered into the grading prompt by engine/grader.py; before this
      # port m_abs fell back to the engine's GENERIC default rule). Reconciled with the m_abs field set: the
      # generic ~95%-predominant rule governs the three SHARED categorical fields (host, country,
      # isolation_source); cf_status keeps its OWN stricter whole-project rule (95% of KNOWN status +
      # non-CF-by-absence, in its per-field block below); collection_date stays deterministic (report
      # earliest/latest -> engine computes the span under the STRICT 2-year rule).
      whole_project_rule: |-
        Propose a single value for ALL samples (applies_whole_project true) when one value covers essentially
        the whole project — either study-wide-constant, OR a PREDOMINANT value shared by about 95%+ of samples.
        An EXACT percentage need not be stated: it is enough that the evidence makes it LIKELY the vast majority
        (probably 95%+) fit a single description — e.g. all isolates from ONE country even when collected across
        many regions/sites within it, or all from one host type. A small minority of exceptions does NOT block
        it: give the predominant value and set applies_whole_project true (only genuine blanks are filled;
        per-sample and existing ENA values are never overwritten). Example: a clinical study described as 97.7%
        inpatients -> host = human (applies_whole_project true).
        This generic rule applies only under whole-project coverage (paper coverage > 75%, or an EBI-wide
        title/description), and to the THREE shared categorical fields: host, country, isolation_source. When
        their values are genuinely mixed with no ~95% predominant value, set applies_whole_project false but
        STILL give your best proposed_value if you have one — it becomes the curator's suggested value at
        escalation (do not null it).
        cf_status is NOT governed by this generic rule: it follows its OWN stricter whole-project rule stated in
        the cf_status per-field block below (a 95% MAJORITY of samples with a KNOWN status, plus the
        non-CF-by-absence inference and the immune-status guard). Apply THAT rule for cf_status, not this one.
        For collection_date, do NOT propose a value or compute a midpoint yourself: report the EARLIEST and
        LATEST collection dates the evidence gives (earliest_date, latest_date, verbatim — a year alone is fine)
        and leave proposed_value null / applies_whole_project false. The engine computes the span and applies
        the STRICT 2-year date rule (see the `escalation` section) deterministically.
      methods:
        - id: whole_project_value
          summary: same value across ALL samples in the project (easy, high yield)
          definition: |-
            When a field is blank but the study implies a single value for every sample, set that value for
            all samples. Allowed only under the whole-project applicability rule (paper_coverage > 75%, or
            an EBI title/description covering the whole accession). Per-field rules below.
        - id: per_sample_table
          summary: per-sample annotation from a table in the paper / supplement (harder)
          definition: |-
            When no single value fits the whole field, look for a per-isolate table in the article or its
            supplement giving values keyed to sample accessions we can map back to our data. This is the
            primary route for AST (per-isolate) and for cf_status where studies mix categories.
      fields:
        country:
          meaning: country of collection
          value_guide: real country / place names (NOT site codes, sample IDs, or abbreviations)
          column_aliases: [country, Country, Continent]      # structured xlsx sources
          whole_project_value: |-
            If the study was done in one country and `country` is blank, set all samples to it.
            The funding agency or grant body, the language of the text, the journal, and the authors'
            institutional affiliations do NOT establish the collection country: a funding agency, language, or
            lab based in a given country does not mean the isolates were collected there.
        isolation_source:
          meaning: the specimen / source the isolate was cultured from (mostly respiratory in M.abs)
          value_guide: clinical/environmental specimen types (sputum, BAL, respiratory, blood, skin, water…)
          column_aliases: [isolation_source]
          whole_project_value: |-
            If all isolates share one source, set it for all samples (same approach as country).
            isolation_source = WHERE THE SAMPLE ORIGINATED — the specimen or environment the isolate was
            recovered from. Be SPECIFIC. M. abscessus is respiratory-dominant, so name the respiratory
            specimen precisely (sputum, induced sputum, BAL / bronchial wash, endotracheal aspirate) rather
            than a bare "respiratory". For extrapulmonary disease name the site (skin / soft tissue, surgical
            wound, blood, other sterile site); for environmental isolates the source can match the host (water,
            plumbing / tap, soil). A bare "swab" is NOT a useful source — name the SITE swabbed. "laboratory" /
            "lab culture" / "in vitro culture" / a culture-medium name (e.g. MGIT) is NOT a valid
            isolation_source — every sequenced isolate is grown in the lab, so that says nothing about its
            origin (and does NOT by itself make the study experimental_evolution). If isolates are described
            only as laboratory / in-vitro cultures with no stated original specimen or environment, leave
            `isolation_source` BLANK; never write "in vitro" / "lab".
        host:
          meaning: the organism the M. abscessus was infecting or colonising when the sample was taken
          value_guide: host organisms (human / Homo sapiens, an animal species) or an environmental source
          column_aliases: [host, host_scientific_name]
          definition: |-
            The HOST is the organism the M. abscessus was living in or on at the time of sampling — the human
            patient or animal it was infecting / colonising, or the environmental source (water, plumbing,
            soil) it was recovered from. It is NOT:
            - the LABORATORY / institution where the isolate was cultured or sequenced — that is where the TEST
              was done, not a host → leave host blank.
            - the SAMPLED ORGANISM'S OWN species name. "Mycobacterium abscessus" / "Mycobacteroides abscessus"
              (or a subspecies) is the bacterium that was sequenced, never its host → treat as no host (blank).
            Nearly all M. abscessus samples are human.
          whole_project_value: |-
            If the study is human clinical, set all hosts to human — UNLESS the samples are environmental
            or animal, in which case host is the environment/animal. (Low priority — nearly all human.)
        collection_date:
          # DETERMINISTIC SPAN (ported to the current engine, 2026-07-17): since 2026-07-13 the grader only
          # REPORTS earliest_date + latest_date; the engine computes the month span and applies the thresholds in
          # the `escalation.collection_date` section (below). David's STRICT 2-year, NEVER-escalate rule
          # (2026-07-02) is preserved by setting five_year_months == two_year_months == 24 there, which collapses
          # the escalate band to zero: <=2yr fills the midpoint, >2yr leaves blank, nothing escalates. This prose
          # therefore no longer tells the grader to compute a midpoint (that would contradict the engine).
          meaning: date (or year) of sample collection
          compare: year                                       # year-level comparison (as Klebsiella)
          column_aliases: [collection_year, Sample_date]
          whole_project_value: |-
            Report the EARLIEST and LATEST collection dates the evidence gives (earliest_date, latest_date),
            verbatim as found — a bare year is fine (e.g. earliest 2015, latest 2016). Do NOT compute a midpoint
            or decide the span; leave proposed_value null and applies_whole_project false. The engine applies the
            STRICT 2-year rule deterministically (escalation.collection_date): a span <= 2 years fills the period
            midpoint; a span > 2 years is left BLANK and never escalated (an imprecise wide-range midpoint would
            corrupt fine-grained lineage dating — David, 2026-07-02).
        cf_status:
          values: [CF, non_CF, unknown]
          meaning: host cystic-fibrosis status — the primary M. abscessus phenotype axis
          value_guide: CF (cystic fibrosis) vs non_CF (any non-CF condition); unknown if not stated
          column_aliases: [cf_status, host_status]            # structured xlsx sources
          definition: |-
            Per-sample CF status of the (human) host.
            - CF: the host has cystic fibrosis — CF clinic/centre, CF cohort/registry, sputum from people
              with CF, explicit "CF patient", or the structured `cf_status` = CF.
            - non_CF: the host has any NON-CF condition — bronchiectasis without CF, COPD, disseminated /
              skin-soft-tissue / post-surgical / wound infection, immunocompromised non-CF, etc., or the
              structured `cf_status` = Non-CF.
            - unknown: not stated; OR the sample is non-human (Animal / Environmental) — those are coded by
              the `host` field, not forced into the CF binary.
            NB immune status is ORTHOGONAL to CF and is NOT evidence either way: CF is a CFTR channelopathy,
            not an immunodeficiency, so "immunocompetent" does not imply non-CF (nor does "immunocompromised"
            imply CF). Do not infer cf_status from immune status — the whole-field call still ESCALATES for a
            human when a study is a big decision, just without a guessed value.
          whole_project_value: |-
            If cf_status is blank, set it from the study-wide CF composition, applying a 95% MAJORITY rule:
            when AT LEAST 95% of the samples with a KNOWN status are one category (CF or non-CF), propose
            that category as the whole-project value and fill every blank with it. This deliberately tolerates
            mislabelling the <5% minority in exchange for far more complete cf_status for phenotyping / GWAS —
            it is safe because whole-field fill only ever writes BLANK cells and NEVER overwrites a sample's
            own known value (so the minority's real labels survive). Below 95% (a 50/50 or 70/30 mix) do NOT
            whole-fill — leave the blanks for per-sample extraction / escalation. Example: a cohort described
            as 208/210 non-CF (99%) → propose non-CF for all; a genuine 50/50 CF/non-CF split → propose
            nothing. Same whole-project applicability rule (paper coverage) as country/host.
            Two ways a value is supported:
            (1) EXPLICIT — a CF clinic / centre / registry / "CF patients" (→ CF), or a named non-CF condition
            such as bronchiectasis without CF, COPD, post-surgical / skin-soft-tissue / disseminated infection
            (→ non-CF), or the structured cf_status.
            (2) NON-CF BY ABSENCE (David, 2026-07-20) — a study that CLINICALLY CHARACTERISES its human patient
            cohort (patient ages, comorbidities, a demographics / clinical table, "collected from patients with
            …") but NEVER mentions cystic fibrosis anywhere is non-CF, even with no non-CF condition named. CF is
            a defining cohort feature a paper ALWAYS states when present, so its complete absence from a
            DESCRIBED patient cohort is positive non-CF evidence. Reinforcing signals (typical of the non-CF
            M. abscessus population, opposite the young CF one): older adults (most / median patients well over
            ~60y), COPD, current / former smokers, non-CF bronchiectasis, prior TB, malignancy, transplant, or
            other chronic lung disease. Propose non-CF (applies_whole_project true, still subject to the 95% +
            paper-coverage rules) and — because this is an INFERENCE surfaced for human review — make the
            evidence_quote STATE THE BASIS: how the cohort is described (the ages / comorbidities you saw) AND
            that no CF is mentioned. GUARD: infer non-CF by absence ONLY when the paper actually describes its
            human patients; a purely genomic / environmental / veterinary / methods paper with no patient
            clinical context is NOT evidence → propose nothing (unknown).

            CRITICAL — do NOT infer CF status from IMMUNE status: "immunocompetent" / "immunocompromised" is
            ORTHOGONAL to CF (CF is a CFTR channelopathy, NOT an immunodeficiency), so it is no evidence of CF or
            non-CF either way. "Patients were immunocompetent" alone → propose nothing — immune status is NOT the
            absence signal above, which requires an actual DESCRIBED patient cohort with no CF mention.

  # AGENTIC CATEGORISATION — data-driven replacement for the hardcoded parse/categorise, scoped to the
  # two messy fields (host, isolation_source). Same block as Klebsiella. null_tokens/null_patterns are
  # blanked IN-MEMORY before the fill stages (laboratory is a tautology, not a source -> NA pre-grading);
  # the induced+approved category scheme lives in the reviewable
  # data/study_lv_attributes/categorisation/<field>_categories_approved.yaml (loaded by `categorise apply`).
  # M.abs isolation_source is respiratory-dominant with environmental + culture-artefact vocabulary.
  categorisation:
    fields:
      host:
        # 'host' is the ORGANISM the bacterium was in/on when sampled — NOT the lab (where the test was done),
        # and NOT the sample's own species name. Blank both pre-fill so the fill agent can supply a real host,
        # and so a species-name-as-host ('Mycobacterium/Mycobacteroides abscessus') never survives as a fake
        # value. null_patterns are case-insensitive; '\bmycobacter' catches both genus spellings (David, 2026-07-21).
        null_tokens: ["not host-associated", "not aplicable"]
        null_patterns: ['\blaborator', '\blab\b', '\bin[ -]?vitro\b', '\bmycobacter', '\babscessus\b']
        categories: []
        # Phase D — decode the CF/non-CF signal buried in host strain codes into `cf_status`.
        # mode: fill sets `cf_status` only where it is BLANK; a code implying a value that
        # conflicts with an existing cf_status is escalated (never silently overwritten). Binary
        # per David: bronchiectasis (BX) / COPD / NCF / NON all fold to non-CF. Site-only codes
        # (CON/HOSP/*TAP/MACH) carry no disease -> no rule -> cf_status stays blank.
        cross_column:
          - {source_pattern: '^CF\d',                target_field: cf_status, target_value: CF,     mode: fill}
          - {source_pattern: '^(BX|COPD|NCF|NON)\d', target_field: cf_status, target_value: non-CF, mode: fill}
      isolation_source:
        # M.abs culture artefacts PLUS the Klebsiella generic/context junk set (ported 2026-07-17): "0"/"unclear"/
        # "others" are non-values, and "clinical"/"surveillance" name a sampling CONTEXT not a specimen — blanking
        # them pre-fill lets the per-sample table supply the real source (e.g. sputum vs skin vs water).
        null_tokens: ["culture or similar", "Laboratory mutation", "MGIT", "0", "unclear", "other", "others", "clinical", "surveillance"]
        null_patterns: ['\blaborator', '\blab\b', '\bin[ -]?vitro\b']
        categories: []
        # Phase D — water/plumbing isolates are environmental; the host categoriser wrongly
        # defaulted their strain codes to human. mode: set relabels host_category -> environment
        # (the cf_status decode above still runs on the code, so CF-household water keeps cf_status=CF).
        cross_column:
          - {source_category: [water_environment], target_field: host_category, target_value: environment, mode: set}
      cf_status:
        # `?` is a non-informative unknown, not a value — blank it PRE-fill (like the other fields' null_tokens)
        # so the fill agent may recover a real CF/non-CF where possible, instead of it sitting as a fake known
        # value (David, 2026-07-18). Preclean wipes it in-memory before the fill stages; the base on disk stays
        # verbatim. `normalise` is the post-hoc canonicaliser (Non-CF -> non-CF case; residual `?`/Environmental
        # -> blank) applied downstream, a belt-and-suspenders net for any token that reaches the master.
        null_tokens: ['?']
        normalise: {'Non-CF': 'non-CF', '?': '', 'Environmental': ''}

# ESCALATION / TRIAGE POLICY for M. abscessus. Mirrors the Klebsiella `escalation` block (identical engine
# mechanism) but with M.abs clinical priors, NOT Klebsiella's. Authored 2026-07-17 (David): WITHOUT this section
# m_abs silently inherited the engine's generic default triage prose, which IS Klebsiella's invasive-vs-carriage
# / blood-dominant rule — wrong for a respiratory-dominant, CF-vs-non-CF species. The engine reads these keys via
# AttributeSpec + escalation.py, falling back to a generic default only when omitted.
escalation:
  # A single value at/above this share of a study's non-blank samples is "dominant" and adopted whole-study.
  dominant_share: 0.95
  # Surface wide-mix escalations for manual review rather than auto-skipping them: the M.abs triage is NOT yet
  # validated against an M.abs ground truth (Klebsiella only set this true after validating its triage on train),
  # so keep genuine wide mixes visible. Flip to true once the M.abs triage is trusted.
  auto_skip_wide_mix: false
  # collection_date span thresholds. STRICT 2-year, NEVER escalate (David, 2026-07-02): five_year_months is set
  # EQUAL to two_year_months (24) so the escalate band is empty — the engine fills the period midpoint for a span
  # <= 24 months and leaves everything wider BLANK (never escalated). old_before_year is inert here (no escalate
  # band to trigger a pre-2010 midpoint) and kept only for schema completeness.
  collection_date:
    two_year_months: 24
    five_year_months: 24
    old_before_year: 2010
  # The triage prose the model reads when deciding a declined isolation_source / host / country / cf_status
  # (collection_date is deterministic; a country region-cluster is deterministic and fed in as context).
  # Encodes the >=95%-or-homogeneous-category adopt/skip rule with M. abscessus priors: pulmonary vs
  # extrapulmonary disease, human vs environmental host, region clustering for country, and the CF phenotype axis.
  triage_guidance: |-
    Decide whether one clean whole-study value can represent this field. ADOPT a single value when EITHER:
      (a) ONE value covers about 95% or more of the study's samples — a clear dominant value. If you cannot
    count exactly, adopt when the evidence makes it LIKELY one value is >=95%.
      (b) the values are BELOW 95% but are HOMOGENEOUS within one closely-related category — then adopt the
    DOMINANT single value WITHIN that category:
        * isolation_source: M. abscessus is overwhelmingly a PULMONARY pathogen. If all specimens are
    respiratory / lower-airway (sputum, induced sputum, BAL / bronchial wash, endotracheal aspirate) -> adopt
    the dominant respiratory specimen (usually sputum). Do NOT adopt if respiratory specimens are mixed with
    EXTRAPULMONARY disease sites (skin / soft-tissue, wound, surgical / disseminated, blood, other sterile
    sites) — that is a genuine WIDE mix (a different disease presentation and patient population). Environmental
    sources (water, plumbing / tap, soil) are a SEPARATE category: a study mixing clinical and environmental
    isolates is a wide mix.
        * country: all countries lie within ONE geographic region (e.g. all East Asia, all W. Europe) -> adopt
    the dominant country. (Region clustering is also computed deterministically and given to you below when it
    applies.)
        * host: all hosts fall in one group (all human; all one animal group) -> adopt the dominant host. Human
    clinical -> human; an environmental study (water / plumbing) -> that environment. A study mixing human with
    environmental (or animal) hosts is a WIDE mix.
        * cf_status (the M.abs phenotype field): a binary categorical, so only case (a) applies — adopt a
    single value ONLY when the evidence makes ONE category ~95%+ of the study (e.g. a CF clinic / registry
    cohort -> CF; a cohort explicitly all bronchiectasis-without-CF / COPD / post-surgical -> non-CF). A
    genuine CF/non-CF mix is a wide_mix_skip — per-sample extraction handles it; do NOT guess. CRITICAL:
    never infer cf_status from IMMUNE status — "immunocompetent" / "immunocompromised" is ORTHOGONAL to CF
    (CF is a CFTR channelopathy, not an immunodeficiency) and is no evidence either way.

    Resolutions:
    - uniform_propose — case (a): one value is ~95%+ of the study.
    - tight_cluster_escalate — case (b): homogeneous within a closely-related category, dominant value adopted.
    - wide_mix_skip — a genuinely WIDE, unrelated mix with no >=95% dominant AND no homogeneous category
    (e.g. sputum + skin/soft-tissue + disseminated; clinical + environmental water; human + environmental;
    CF + non-CF; countries across continents). Do not ask — per-sample extraction handles it.

    For uniform_propose or tight_cluster_escalate, set representative_value to that single dominant value. It
    MUST be a SINGLE, PARSEABLE, CANONICAL value of the field, never a region, a list, or a concatenation:
        * country: ONE country name (e.g. 'United Kingdom', 'South Korea') — NOT a region/continent and NOT a
    join. If the countries cluster to one region but no single country is dominant, prefer wide_mix_skip (the
    engine surfaces the region separately for the curator).
        * isolation_source: one specimen term (e.g. 'sputum'); host: one host (e.g. 'human'); cf_status: one
    status (e.g. 'CF' or 'non-CF').
    Set representative_value null for wide_mix_skip. Use the ENA base distribution provided (counts per value)
    to apply the 95% test; for values that appear only in the paper, use the paper's own proportions. Give a
    one-line cluster_theme naming the cluster and why it is homogeneous or wide, plus a verbatim
    evidence_quote. Judge ONLY from the evidence above; do not guess.

# COHORT FLAGS emitted per accession. Carried from Klebsiella. [keep]
cohort_flags:
  needs_manual_download:
    description: paper found but full text not openly accessible
    definition: |-
      Fires when one or more papers describing the cohort were found, but the detailed full text cannot be
      accessed because it is paywalled (no open full text). Flags the accession for manual retrieval.
