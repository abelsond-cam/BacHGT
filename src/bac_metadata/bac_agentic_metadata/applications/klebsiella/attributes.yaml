# Attribute spec — Klebsiella application
#
# SINGLE SOURCE OF TRUTH for the Klebsiella curation + escalation RULES. David edits this directly; the engine
# (species-agnostic, under ../../engine/) only assembles + applies what is written here. Everything that makes a
# decision Klebsiella-specific — attribute value sets, the per-attribute grading definitions, the whole-project
# fill rule, the escalation thresholds + triage prose — lives in this ONE document, in labelled sections:
#   gates                        — tunable pipeline thresholds (completeness, escalation residual floor + big-decision)
#   taxon_of_interest            — the genus we size / grade / measure completeness over
#   attributes.paper_selection   — coverage gate for applying a whole-project value
#   attributes.study_filters     — study_type (cohort in/out)
#   attributes.study_level       — study-wide judgements read from the paper / EBI (setting, amr, age)
#   attributes.per_sample_completeness — the four backfilled fields + the whole_project_rule + per-field rules
#   attributes.categorisation    — per-field null_tokens / (future) category schemes
#   escalation                   — dominant-value threshold, collection_date span thresholds, triage prose
#   cohort_flags                 — per-accession flags (e.g. needs_manual_download)
# Do not invent grading criteria — change definitions only with David. Generic MECHANISM stays in the engine;
# APPLICATION policy (rules + numbers) stays here. See bac_agentic_metadata/PROGRESS_REPORT.md for the pipeline.
# Unit of work = project accession (study_accession). Grade scale applies to every attribute:
grade_scale: [gradeable, partial, not_gradeable]

application: klebsiella
species: Klebsiella pneumoniae species complex (KPSC)

# PIPELINE GATES — the application's tunable curation thresholds, shared across the fill / backfill /
# escalation / run-health stages. Edit these numbers here (the engine reads them via AttributeSpec and falls
# back to a generic default only when an app omits a key). Together with the `escalation` section below, this
# makes the yaml the application's constants file. David, 2026-07-14.
gates:
  completeness_threshold: 0.75         # ENA non-null fraction at/above which a field counts as already complete -> not filled
  escalation_residual_floor: 50        # min blank samples remaining after per-sample before a field is worth escalating
  escalation_big_decision_frac: 0.01   # a study at/above this fraction of the WHOLE cohort is an escalation "big decision" (audit + leverage)
  # Paper-text truncation ceiling fed to the grader + escalation triage. ~4 chars/token, so 250k chars ~= 62k
  # tokens — well within Sonnet's 200k-token context, and captures ~p90 of Klebsiella full texts (median 140k,
  # p90 209k chars; the old 120k truncated ~65% of papers). Higher = more complete evidence but more tokens per
  # call (usage-limited on the subscription backend); lower = cheaper/faster but risks cutting late methods/tables.
  max_paper_chars: 250000

# Genus/species we are studying. Projects can be broad (e.g. all Enterobacteriaceae) while
# we only care about one genus, so project sizing, paper coverage and completeness are all
# computed over records MATCHING this, not over the whole project.
taxon_of_interest:
  rank: genus
  name: Klebsiella
  scientific_name_match: [Klebsiella]   # substring match against the ENA `scientific name`

attributes:

  # 0) PAPER SELECTION — sizing the project (from EBI) and how well the chosen paper covers it.
  paper_selection:
    paper_coverage_for_taxon:
      description: >-
        Fraction of the project's taxon-of-interest records (NOT total project records)
        that the chosen paper describes. Derived from the EBI project counts: how many
        records match `taxon_of_interest` (the denominator) vs how many of those the
        paper accounts for. Distinguishes a whole-project paper from one describing only a
        subsample, and guides picking the paper covering the largest part.
      inputs: [project_records_in_taxon, paper_records_in_taxon]
      ground_truth: none                  # not previously curated -> generate + spot-check
      definition: |-
        Computed fraction = paper_records_in_taxon / project_records_in_taxon, where
        paper_records_in_taxon is the number of taxon-of-interest samples the chosen paper
        accounts for (usually stated clearly in the paper) and project_records_in_taxon is the
        project's taxon-of-interest record count (from the EBI sizing). It gates whether a
        study-level whole-project value (e.g. all blood, all from England) may be applied to
        every sample: coverage > 75% -> apply to the whole project (study-level attributes can
        be `gradeable`); <= 75% -> do not apply project-wide UNLESS the EBI study
        title/description itself states it applies to the whole study (those attributes
        otherwise fall to `partial` / unattributed). It also guides picking the paper that
        covers the largest part of the project.

  # 1) STUDY FILTERS — decide whether the whole study enters the cohort.
  study_filters:
    study_type:
      values: [observational, experimental_evolution, other]
      exclude_if: [experimental_evolution]   # experimental-evolution studies are dropped
      ground_truth: curated_implicit          # excluded studies absent from study_level
      definition: |-
        How the isolates arose. Observational by default.
        - observational: isolates sampled as they occur (clinical, carriage, environmental).
        - experimental_evolution: a study that DELIBERATELY alters the strains and then sequences them
          — by genetic engineering (gene knockout, CRISPR) OR by inducing evolution (e.g. serial
          passage or culturing in antibiotic broth to drive resistance mutations). Specific and rare;
          the paper states it explicitly. Routine lab culturing of clinical/environmental isolates is
          NOT experimental evolution — almost every study grows its isolates in vitro, and an
          isolation_source or host of "in vitro" / "laboratory" on its own does NOT make a study
          experimental_evolution. These studies are EXCLUDED from the cohort.
        - other: anything not fitting the above.

  # 2) STUDY-LEVEL JUDGEMENTS — inferred from the paper or EBI project accession title and description; these are absent from structured data.
  study_level:
    # Shared rule for EVERY study-level attribute below. Each is a SINGLE value for the whole
    # study, inferred from the journal article OR from the EBI study title + description (the
    # latter is sometimes enough on its own, e.g. "all hospital", "all AMR"). The value may be
    # applied to all samples in the accession only when we are confident the description covers
    # the whole study accession. The grade records that confidence:
    sizing_first: |-
      SIZING SANITY-CHECK — DO THIS FIRST, BEFORE GRADING. Establish the true size of THIS
      accession from ENA, then reconcile it against the numbers stated in the article. Trust the
      ENA-derived counts (Stage-1 ena_taxon_samples / total samples); do NOT trust any
      spreadsheet's samples_in_study / kleb_in_study — those are frequently wrong.
      Let E = the ENA-deposited count for this accession (E_taxon = the taxon-of-interest subset).
      Compare E to the article:
        A) article's SCREENED / COLLECTED cohort is substantially LARGER than E
             -> substantial SAMPLE SELECTION happened before sequencing: only a subset (often the
                resistant one) was actually sequenced and deposited. Grade amr_study on that
                deposited subset (this is the PRJEB28400 pattern: screened ~3100, E=1950 -> amr).
        B) article's SEQUENCED-genome count is substantially LARGER than E
             -> the study spans MULTIPLE accessions and this is only one of them (often not stated
                explicitly); the project values may not cover the whole article.
        C) article's sequenced count is substantially SMALLER than E
             -> this is a SHARED / umbrella accession holding more than this one study deposited;
                a single whole-project value may not be gradeable.
      Counts always refer to the ENA-deposited set, never the parent/screened cohort.
    grading_basis: |-
      gradeable     — a single value is supported for the WHOLE project, by the EBI study
                      title/description, or by a paper describing most (>75%) of
                      the project's taxon-of-interest records. Applied to every sample.
      partial       — a value applies to only part of the project and CANNOT be attributed to
                      specific samples. Attributing it would require a per-sample table in the
                      paper (sample accessions we can map back to our data); we do not attempt
                      that for now — these accessions will be left as unattributed and possibly
                      revisited later.
      not_gradeable — the value cannot be determined from the EBI metadata or an accessible paper.
    study_setting:
      values: [hospital, community, mixed]
      ground_truth: curated                   # study_level col `study_setting`
      definition: |-
        Care setting the isolates were collected in, as one value for the whole project.
        - hospital: human inpatient care. Inferred when the samples are all blood cultures,
          respiratory swabs, or other deep-tissue specimens; are described as from hospital
          patients or hospital environments; or as from "patients" without further qualification
          (default to hospital). Wastewater / sewerage is hospital when hospital is the likely
          source (it usually is). Hospital-based colonization/carriage screening is hospital.
        - community: human but sampled outside hospital — clinics, general community, carriage
          surveys, outpatient / primary care, long-term-care / nursing-home residents — OR a
          non-human host. Judge by where/how isolates were ACTUALLY collected: a study "arm"
          labelled hospital-associated by a participant's prior-hospitalization HISTORY is a
          risk-factor classification, not a hospital sampling source.
        - mixed: the study deliberately samples BOTH hospital and genuine community/outpatient
          sources (any deliberate second-setting arm counts, even a small %). A mere mix of
          specimen categories that are all hospital-sourced (clinical vs colonization vs
          environmental) stays hospital.
        Precedence: "hospital" means HUMAN inpatient care. A hospital source (incl. hospital
        environment / hospital-sourced wastewater) wins over the non-human -> community rule, so a
        non-human hospital-environment isolate is hospital; but non-human hosts presenting to
        VETERINARY hospitals / diagnostic labs remain community (the precedence covers
        human-hospital environment/wastewater only, not non-human clinical isolates).
    amr_study:                                # a.k.a. `sample_selection` in the v1.0 snapshot
      values: [amr, mixed, surveillance]
      ground_truth: curated                   # study_level col `amr_study`/`sample_selection`
      definition: |-
        Why isolates were chosen for sequencing — the SAMPLING RULE that governed which isolates
        entered THIS deposited project. Judge on the isolates actually sequenced/deposited under
        this accession, NOT the parent survey's broader collection design: a resistant subset
        deposited from a larger screened/surveillance cohort is amr, and susceptible isolates the
        parent survey collected but did NOT sequence here do not make it mixed. (Sample counts
        likewise refer to the ENA-deposited set, not the parent cohort — so a screened cohort of
        thousands that deposits only its resistant subset is sized by the deposit.)
        - amr: every sequenced isolate had to meet an AMR attribute to be selected — a
          non-susceptible antibiotic-susceptibility-test (AST) result (resistant "R", or
          intermediate / "increased exposure" "I"), OR a positive test for a pre-defined
          antibiotic-resistance gene. This includes AMR-SELECTIVE screening (e.g. CPE /
          carbapenemase selective media) and reference-centre collections selected by
          resistance-gene positivity — the resistance gate decides, not the specimen method
          (screening swabs / stool can still be amr).
        - surveillance: all isolates meeting a NON-AMR sampling rule were sequenced — e.g. all
          positive blood cultures, all patients' rectal/faecal swabs, or ALL clinical isolates of
          the taxon (one per patient/episode) across mixed specimen types (blood, urine, sputum,
          pus). Resistance may be characterised AFTERWARDS; that does not make it amr. Routine
          MDRO / infection-control SCREENING that recovers all carriers regardless of resistance is
          surveillance: the screen is the sampling frame, not a per-isolate AMR gate (contrast the
          AMR-selective screening above, which IS amr).
        - mixed: the deposited set contains both AMR-selected and non-AMR isolates — AMR-selected
          cases PLUS deliberately-added susceptible matched controls (e.g. one susceptible isolate
          per resistant case); serial/longitudinal susceptible isolates from resistant patients
          (de novo emergence); or a deliberate two-category contrast design (e.g. ESBL + non-ESBL,
          or resistant-human + susceptible-livestock).
        Do NOT infer amr from naming or topic: a project called "AMR" / "AMR surveillance" /
        "AMR monitoring", or a study aim like "transmission of [resistant organism]", does not by
        itself imply AMR-based selection — the deciding factor is whether EACH sequenced isolate was
        required to have a resistant phenotype/genotype to enter the set.
    amr_target:
      values: [third_gen_cephalosporin, carbapenem, other]
      applies_when: amr_study in [amr, mixed]
      ground_truth: none                      # WANTED, not yet collected -> generate + spot-check
      definition: |-
        The specific resistance the study selected for. Only assigned when
        amr_study in [amr, mixed]; otherwise not applicable.
        - third_gen_cephalosporin: selection targeted 3GC resistance (e.g. ESBL;
          ceftriaxone/cefotaxime/ceftazidime).
        - carbapenem: selection targeted carbapenem resistance (CPE/CRE).
        - other: any other targeted resistance.
        Not yet curated -> generate + spot-check.
    amr_method:
      values: [pcr_gene_presence, ast_result]
      applies_when: amr_study in [amr, mixed]
      ground_truth: none                      # WANTED, not yet collected -> generate + spot-check
      definition: |-
        How the AMR attribute used for selection was established (the counterpart to amr_study =
        amr/mixed). Only assigned when amr_study in [amr, mixed].
        - ast_result: a phenotypic antibiotic-susceptibility test classed the isolate resistant.
        - pcr_gene_presence: a PCR for a pre-defined resistance gene was positive.
        Not yet curated -> generate + spot-check.
    cohort_age:
      values: [newborn_young_child, adult, mixed]
      ground_truth: partial                   # study_level `cohort_age`/`newborn_cohort` unfinished
      definition: |-
        Age band of the hosts, as one value for the whole project. Gradeable only when ALL
        subjects (and all their samples) fall in one band.
        - newborn_young_child: all hosts < 12 years old (usually much younger; the loose <12
          cutoff is deliberate).
        - adult: all hosts > 18 years old.
        - mixed: the study spans both bands (incl. cohorts straddling the 12-18 gap).
        Evidence: often explicit, but may be inferred from a per-host age table in the paper —
        a median + range/distribution that lies wholly within a band counts (e.g. median 65,
        IQR 15 -> almost certainly all adults -> adult). If the distribution overlaps the
        boundary, it is mixed (or partial / unattributed if it applies to only some samples).
      note: drives the invasion-gene comparison (newborns/young children vs adults)

  # 3) STANDARD PER-SAMPLE VARIABLES — the four fields we curate, and how we BACKFILL them.
  #    This is the MAJORITY of the task. The four fields already exist in the ATB metadata but
  #    are often missing; curation targets filling those gaps from the paper (or Pathogen Watch).
  #    Completeness itself is just MEASURED (non-null fraction per field, before vs after
  #    backfill — Stage 1 already does this); it is a RESULT of curation, not a thing collected.
  per_sample_completeness:
    fields: [country, collection_date, isolation_source, host]
    ground_truth: parsed_per_project          # the reliable "what was improved" record
    deterministic_normaliser:                 # existing parse/categorise pairs in pp/metadata_curation.py
      country: [parse_country, categorise_region]
      collection_date: [parse_collection_date]
      isolation_source: [parse_isolation_source, categorise_isolation_source]
      host: [parse_host, categorise_host]
    completeness:
      definition: |-
        Non-null fraction per field, computed before and after backfill (Stage 1 reports this
        across the base / post-merge / normalised states). Measured, not curated — so it has no
        gradeable/partial/not_gradeable grade of its own.
    # THE BACKFILL — the high-effort core. Fill each field where ENA left it blank, two methods
    # tried in order (method a is easy/high-yield; method b is harder/lower-yield but important).
    backfill:
      # WHOLE-PROJECT FILL RULE — the application policy the grader applies to decide when ONE value covers the
      # whole project (rendered into the grading prompt by engine/grader.py; the engine only assembles it).
      whole_project_rule: |-
        Propose a single value for ALL samples (applies_whole_project true) when one value covers essentially
        the whole project — either study-wide-constant, OR a PREDOMINANT value shared by about 95%+ of samples.
        An EXACT percentage need not be stated: it is enough that the evidence makes it LIKELY the vast majority
        (probably 95%+) fit a single description — e.g. all isolates from ONE country even when collected across
        many regions/sites within it (16 of 17 regions of the Philippines -> country = Philippines), or all from
        one host type. A small minority of exceptions does NOT block it: give the predominant value and set
        applies_whole_project true (only genuine blanks are filled; per-sample and existing ENA values are never
        overwritten). Examples: a clinical study described as 97.7% inpatients -> host = human; a nationwide
        surveillance study across a country's regions -> country = that country — both applies_whole_project true.
        This applies only under whole-project coverage (paper coverage > 75%, or an EBI-wide title/description),
        and to the categorical fields (host, country, isolation_source). Only when the values are genuinely mixed
        with no ~95% predominant value, set applies_whole_project false but STILL give your best proposed_value if
        you have one — it becomes the curator's suggested value at escalation (do not null it).
        For collection_date, do NOT propose a value or compute a midpoint yourself: report the EARLIEST and LATEST
        collection dates the evidence gives (earliest_date, latest_date, verbatim — a year alone is fine) and
        leave proposed_value null / applies_whole_project false. The engine computes the span and applies the
        date-span rule (see the `escalation` section) deterministically.
      methods:
        - id: whole_project_value
          summary: same value across ALL samples in the project (easy, high yield)
          definition: |-
            When a field is blank but the study implies a single value for every sample, hard-code
            that value for all samples. Allowed only under the whole-project applicability rule
            (paper_coverage_for_taxon > 75%, or an EBI title/description covering the whole
            accession). Per-field rules in `fields` below.
        - id: per_sample_table
          summary: per-sample annotation from a table in the paper / Pathogen Watch (harder)
          definition: |-
            When no single value fits the whole field (e.g. a mix of urine and blood with no way
            to tell which sample is which), look for a table in the journal article (or Pathogen
            Watch) giving per-sample values keyed to sample accessions we can map back to our
            data. Where that mapping is unavailable this is deferred (see study_level
            grading_basis: `partial` / unattributed).
      fields:
        country:
          meaning: country of collection
          whole_project_value: |-
            If the study was done in one country and `country` is blank, set all samples to it
            (e.g. study in the Philippines -> all = Philippines).
            The funding agency or grant body, the language of the text, the journal, and the
            authors' institutional affiliations do NOT establish the collection country: a funding
            agency, language, or lab based in a given country does not mean the isolates were
            collected there (e.g. a French funding agency does not make the country France).
        isolation_source:
          meaning: the specimen / source the isolate was cultured from
          whole_project_value: |-
            If all isolates share one source, set it for all samples (same approach as country).
            isolation_source = WHERE THE SAMPLE ORIGINATED — the specimen or environment the isolate
            was recovered from. Be SPECIFIC. If the host is environmental, the source can match the
            host (e.g. wastewater). If the host is an animal or plant, the source is the body specimen
            (e.g. urine, blood, stool/faeces, respiratory, skin). A bare "swab" is NOT a useful source
            — name the SITE swabbed: rectal swab, skin wound swab, surgical wound swab, throat swab,
            etc. "laboratory" / "lab culture" / "in vitro culture" / a culture-medium name is NOT a
            valid isolation_source — every sequenced isolate is grown in the lab, so that says nothing
            about its origin (and does NOT by itself make the study experimental_evolution). If isolates
            are described only as laboratory / in-vitro cultures with no stated original specimen or
            environment, leave `isolation_source` BLANK; never write "in vitro" / "lab".
        host:
          meaning: the host organism (or environment) the isolate came from
          whole_project_value: |-
            host names the ORGANISM or ENVIRONMENT the isolate came from — be as SPECIFIC as the
            evidence allows. Categories of interest: human; a specific animal species or group (e.g.
            cattle, pigs, poultry); a plant; or an environment (wastewater, clinical surfaces, soil,
            water). If the study is hospital/clinical and about patients, set all hosts to human —
            UNLESS the samples are environmental (wastewater, clinical surfaces) or from a non-human
            host, in which case host is that environment/species, not human.
            "in vitro" / "lab culture" / "laboratory" is NOT a host — it only means the isolate was
            grown on a plate (true of nearly every isolate). Leave host BLANK in that case; never write
            "in vitro" / "lab".
        collection_date:
          # DETERMINISTIC SPAN (David, 2026-07-13): the grader only REPORTS earliest_date + latest_date; the engine
          # computes the month span and applies the thresholds in the `escalation.collection_date` section. This
          # removes the calendar-label counting that misread a 20-month span as ">2 years" (PRJEB36486).
          meaning: date of sample collection
          whole_project_value: |-
            Report the EARLIEST and LATEST collection dates the evidence gives (earliest_date, latest_date),
            verbatim as found — a bare year is fine (e.g. earliest 2003, latest 2007). Do NOT compute a midpoint
            or decide the span; leave proposed_value null and applies_whole_project false. The engine applies the
            span thresholds in the `escalation.collection_date` section deterministically.

  # AGENTIC CATEGORISATION — the data-driven replacement for the hardcoded parse/categorise rule-system
  # in pp/metadata_curation.py, scoped to the two messy fields (host, isolation_source). Three uses:
  #   - null_tokens: field-specific placeholder text (beyond engine PLACEHOLDER_NULLS) wiped to blank
  #     IN-MEMORY before the fill stages, so the agent gets a chance to fill them (engine/categorise/preclean.py).
  #   - categories: the induced, HUMAN-APPROVED category scheme (name/definition/examples/NA). Populated
  #     by `engine.cli.categorise induce` -> reviewed here. Empty until Phase B.
  #   - cross_column: hints for the reconcile stage (a category in one field implying another field).
  categorisation:
    fields:
      host:
        null_tokens: ["not host-associated", "not aplicable"]   # beyond PLACEHOLDER_NULLS; ported from parse_host
        null_patterns: ['\blaborator', '\blab\b', '\bin[ -]?vitro\b']  # laboratory is a tautology, not a host -> NA pre-grading
        categories: []
        cross_column: []
      isolation_source:
        # "clinical" / "surveillance" name a sampling CONTEXT, not a specimen/site (the definition of
        # isolation_source) — uninformative as a source, so blank them pre-fill (like "laboratory") to let
        # the per-sample table / paper supply the real specimen (e.g. blood vs perirectal surveillance swab,
        # the carriage-vs-invasive distinction). David, 2026-07-11.
        null_tokens: ["0", "unclear", "others", "clinical", "surveillance"]  # beyond PLACEHOLDER_NULLS; ported from parse_isolation_source
        null_patterns: ['\blaborator', '\blab\b', '\bin[ -]?vitro\b']  # laboratory/in-vitro is not a source -> NA pre-grading
        categories: []
        cross_column: []

# ESCALATION / TRIAGE POLICY — how a grader-DECLINED field (no whole-project value) is resolved into a single
# whole-study value or surfaced to the curator. This is APPLICATION policy; the engine supplies only the generic
# mechanism (candidacy gate on the post-per-sample residual, ENA value-distribution counting, the deterministic
# collection_date span + country region-cluster computation). The thresholds + the triage prose below are what
# make it Klebsiella-specific — edit them here, not in the engine (engine/{escalation,grader,value_validity}.py
# read these keys, falling back to a generic default only when an application omits them). David, 2026-07-14.
escalation:
  # A single value at/above this share of a study's non-blank samples is "dominant" and adopted whole-study.
  dominant_share: 0.95
  # collection_date span thresholds — the engine computes the true month span from the grader's earliest/latest
  # endpoints (period-enclosing, not calendar-label counting) and applies: <= two_year_months -> fill midpoint;
  # two_year_months..five_year_months -> escalate, midpoint suggested ONLY if the period is before old_before_year
  # (older genomes are scarce, so an approximate date is worth more; recent mid-range dates are low-value and
  # surface blank); > five_year_months -> left blank.
  collection_date:
    two_year_months: 24
    five_year_months: 60
    old_before_year: 2010
  # The triage prose the model reads when deciding a declined isolation_source / host / country (collection_date
  # is deterministic; a country region-cluster is deterministic and fed in as context). Encodes the >=95%-or-
  # homogeneous-category adopt/skip rule with the Klebsiella clinical priors (invasiveness as the phenotype axis).
  triage_guidance: |-
    Decide whether one clean whole-study value can represent this field. ADOPT a single value when EITHER:
      (a) ONE value covers about 95% or more of the study's samples — a clear dominant value. If you cannot
    count exactly, adopt when the evidence makes it LIKELY one value is >=95%.
      (b) the values are BELOW 95% but are HOMOGENEOUS within one closely-related category — then adopt the
    DOMINANT single value WITHIN that category:
        * isolation_source: all specimens are invasive infection sites (blood, CSF, BALF / deep respiratory,
    deep wound / abscess, other normally-sterile sites) -> adopt the dominant invasive specimen (usually
    blood). Do NOT adopt if invasive sites are mixed with carriage / screening (rectal, stool, perirectal,
    nasal or skin colonisation) — that is a genuine WIDE mix.
        * country: all countries lie within ONE geographic region (e.g. all Central America, all East Africa,
    all W. Europe) -> adopt the dominant country. (Region clustering is also computed deterministically and
    given to you below when it applies.)
        * host: all hosts fall in one group (all human clinical; all domesticated animals) -> adopt the
    dominant host.

    Resolutions:
    - uniform_propose — case (a): one value is ~95%+ of the study.
    - tight_cluster_escalate — case (b): homogeneous within a closely-related category, dominant value adopted.
    - wide_mix_skip — a genuinely WIDE, unrelated mix with no >=95% dominant AND no homogeneous category
    (e.g. blood + urine + respiratory + wound; invasive sites mixed with rectal/stool carriage; UK + Malawi +
    Argentina across continents; human + animal + environmental). Do not ask — per-sample extraction handles it.

    For uniform_propose or tight_cluster_escalate, set representative_value to that single dominant value. It
    MUST be a SINGLE, PARSEABLE, CANONICAL value of the field, never a region, a list, or a concatenation:
        * country: ONE country name (e.g. 'Malawi', 'Guatemala') — NOT a region/continent and NOT a join. If
    the countries cluster to one region but no single country is dominant, prefer wide_mix_skip (the engine
    surfaces the region separately for the curator).
        * isolation_source: one specimen term (e.g. 'blood'); host: one host (e.g. 'human').
    Set representative_value null for wide_mix_skip. Use the ENA base distribution provided (counts per value)
    to apply the 95% test; for values that appear only in the paper, use the paper's own proportions. Give a
    one-line cluster_theme naming the cluster and why it is homogeneous or wide, plus a verbatim
    evidence_quote. Judge ONLY from the evidence above; do not guess.

# COHORT FLAGS emitted per accession alongside the attributes above.
cohort_flags:
  needs_manual_download:
    description: paper found but full text not openly accessible
    definition: |-
      Fires when one or more papers describing the cohort were found, but the detailed full text
      cannot be accessed because it is paywalled (no open full text). Flags the accession for
      manual retrieval of the paper.
